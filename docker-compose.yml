services:
  app:
    build: .
    container_name: speakai
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://speakai:speakai_secret@db:5432/speakai
      AUTH_SECRET: change-me-to-a-random-string
      AUTH_URL: http://localhost:3000
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      TTS_API_KEY: ${TTS_API_KEY}
      TTS_BASE_URL: ${TTS_BASE_URL:-https://api.openai.com/v1}
      VISION_API_KEY: ${VISION_API_KEY}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://api.openai.com/v1}
      VISION_MODEL: ${VISION_MODEL:-gpt-4.1-mini}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      WELCOME_CREDITS: ${WELCOME_CREDITS:-3}
      STRIPE_PLAN_A_CREDITS: ${STRIPE_PLAN_A_CREDITS:-15}
      STRIPE_PLAN_A_PRICE_HKD: ${STRIPE_PLAN_A_PRICE_HKD:-15}
      STRIPE_PLAN_B_CREDITS: ${STRIPE_PLAN_B_CREDITS:-50}
      STRIPE_PLAN_B_PRICE_HKD: ${STRIPE_PLAN_B_PRICE_HKD:-45}
    volumes:
      - audio_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: speakai-db
    restart: always
    environment:
      POSTGRES_DB: speakai
      POSTGRES_USER: speakai
      POSTGRES_PASSWORD: speakai_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  audio_data:
  pg_data:
